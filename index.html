<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Solar Tycoon 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial,sans-serif;overflow:hidden}
#game{position:fixed;inset:0}
#ui{position:fixed;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;gap:6px;padding:9px}
.stat{background:#142b35eF;border:1px solid #42606a;border-radius:10px;padding:8px 10px;font-size:12px;min-width:30%;box-shadow:0 3px 12px #0005}
.stat b{display:block;font-size:16px;color:#7fffc0;margin-top:3px}
#bottom{position:absolute;bottom:0;left:0;right:0;padding:10px;background:linear-gradient(transparent,#07131af5 18%);pointer-events:auto}
#info{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;gap:8px}
#shop{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px}
button{border:1px solid #52717a;background:#193943;color:white;border-radius:10px;padding:10px 12px;font-size:12px;white-space:nowrap}
button:active{background:#28765e}
button b{display:block;color:#7fffc0;margin-top:4px}
#message{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#173b34;padding:9px 14px;border-radius:9px;font-size:13px;display:none}
#help{position:absolute;right:10px;top:78px;pointer-events:auto}
#panel{position:absolute;left:10px;top:78px;background:#142b35d9;padding:8px 10px;border-radius:9px;font-size:11px}
</style>
</head>
<body>
<div id="game"></div>
<div id="ui">
 <div class="top">
  <div class="stat">ДЕНЬ<b id="day">1</b></div>
  <div class="stat">ДЕНЬГИ<b id="money">₴100 000</b></div>
  <div class="stat">МОЩНОСТЬ<b id="power">0 кВт</b></div>
 </div>
 <div id="panel">☀️ <span id="weather">Ясно</span><br>⚡ <span id="energy">0 кВт·ч</span><br>💰 <span id="income">₴0</span></div>
 <button id="help" onclick="showHelp()">?</button>
 <div id="message"></div>
 <div id="bottom">
  <div id="info">
   <span>Участок: <b id="land">12 × 12</b></span>
   <span>Продажа: <b>₴8 / кВт·ч</b></span>
   <span>Автопродажа: <b>ВКЛ</b></span>
  </div>
  <div id="shop">
   <button onclick="buyPanel(450)">Панель 450 Вт<b>₴2 000</b></button>
   <button onclick="buyPanel(550)">Панель 550 Вт<b>₴2 400</b></button>
   <button onclick="buyPanel(600)">Панель 600 Вт<b>₴2 700</b></button>
   <button onclick="buyPanel(700)">Панель 700 Вт<b>₴3 100</b></button>
   <button onclick="buyInverter(5)">Инвертор 5 кВт<b>₴8 000</b></button>
   <button onclick="buyInverter(10)">Инвертор 10 кВт<b>₴14 000</b></button>
   <button onclick="buyInverter(30)">Инвертор 30 кВт<b>₴29 000</b></button>
   <button onclick="buyInverter(50)">Инвертор 50 кВт<b>₴42 000</b></button>
   <button onclick="buyInverter(100)">Инвертор 100 кВт<b>₴70 000</b></button>
   <button onclick="buyTransformer()">Трансформатор<b>₴25 000</b></button>
   <button onclick="buyBattery()">Аккумулятор<b>₴18 000</b></button>
  </div>
 </div>
</div>

<script>
const SAVE_KEY="solar_tycoon_real_1";
let state={
 money:100000,day:1,panels:[],inverters:[],transformer:false,
 battery:false,energy:0,totalSold:0,lastTime:Date.now(),
 dayStart:Date.now(),weather:"Ясно"
};
try{
 const saved=JSON.parse(localStorage.getItem(SAVE_KEY));
 if(saved)state={...state,...saved};
}catch(e){}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc8e5);
scene.fog=new THREE.Fog(0x9bc8e5,35,100);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,300);
camera.position.set(13,15,20);
camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd8edff,0x52613c,1.3));
const sun=new THREE.DirectionalLight(0xfff0d4,2.0);
sun.position.set(-15,25,12);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-30;sun.shadow.camera.right=30;
sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;
scene.add(sun);

function mat(color,rough=.8,metal=0){
 return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
}
const grassMat=mat(0x527b3c);
const metalMat=mat(0x87949a,.35,.8);
const darkMat=mat(0x17232b,.25,.5);
const glassMat=new THREE.MeshStandardMaterial({
 color:0x102d49,metalness:.65,roughness:.2,
});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),grassMat);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;scene.add(ground);

const grid=new THREE.GridHelper(24,24,0x8b9d72,0x71895d);
grid.position.y=.025;scene.add(grid);

function box(w,h,d,material,x,y,z,parent=scene){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}
function cylinder(r1,r2,h,material,x,y,z,parent=scene){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,12),material);
 m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;
}
function makePanel(x,z,watt){
 const g=new THREE.Group();
 const frame=box(1.95,.09,1.12,metalMat,0,0,0,g);
 frame.position.y=.85;
 const glass=box(1.83,.035,1.0,glassMat,0,.91,0,g);
 // Фотоэлементы и тонкие разделительные линии
 const cellMat=new THREE.MeshStandardMaterial({
  color:0x173d63,metalness:.45,roughness:.25
 });
 for(let r=0;r<6;r++){
  for(let c=0;c<10;c++){
   box(.174,.012,.145,cellMat,
    -.82+c*.182,.936,-.405+r*.162,g);
  }
 }
 const railMat=mat(0x737e84,.5,.8);
 box(2.05,.07,.09,railMat,0,.65,-.42,g);
 box(2.05,.07,.09,railMat,0,.65,.42,g);
 cylinder(.045,.045,.85,metalMat,-.65,.4,0,g);
 cylinder(.045,.045,.85,metalMat,.65,.4,0,g);
 g.position.set(x,0,z);
 g.rotation.x=-.18;
 scene.add(g);
 g.userData={type:"panel",watt};
 return g;
}
function makeInverter(x,z,kw){
 const g=new THREE.Group();
 box(.85,1.15,.48,mat(0xc5cdd0,.6,.45),0,.58,0,g);
 box(.62,.24,.025,mat(0x172d34),0,.86,.25,g);
 box(.27,.12,.02,mat(0x40db8a,.2),0,.86,.27,g);
 for(let i=0;i<7;i++){
  box(.55,.025,.025,mat(0x6b777b),0,.42+i*.065,.25,g);
 }
 box(.12,.18,.06,mat(0x333d40),.28,.18,.25,g);
 g.position.set(x,0,z);scene.add(g);
 return g;
}
function makeTransformer(x,z){
 const g=new THREE.Group();
 box(1.8,1.2,1.25,mat(0x7c898c,.55,.6),0,.75,0,g);
 for(let s of [-1,1]){
  for(let i=0;i<8;i++){
   box(.07,.95,.08,metalMat,s*.97,.75,-.48+i*.135,g);
  }
 }
 for(let i=0;i<3;i++){
  cylinder(.12,.12,.65,mat(0xddd5b4,.3),-.5+i*.5,1.65,0,g);
  cylinder(.04,.04,.5,mat(0x333d40,.3),-.5+i*.5,2.15,0,g);
 }
 g.position.set(x,0,z);scene.add(g);
 return g;
}
function makeBattery(x,z){
 const g=new THREE.Group();
 box(2.3,1.5,1.15,mat(0xbac4c5,.65,.4),0,.8,0,g);
 for(let i=0;i<12;i++)box(.035,.85,.03,mat(0x606e70),-.85+i*.155,.8,.59,g);
 box(.45,.35,.03,mat(0x253b42),.7,1.2,.59,g);
 g.position.set(x,0,z);scene.add(g);
 return g;
}
function makeTree(x,z,s=1){
 const g=new THREE.Group();
 cylinder(.13,.2,1.1,mat(0x60472b),0,.55,0,g);
 const leaves= new THREE.Mesh(
  new THREE.ConeGeometry(.75,1.8,7),
  mat(0x285d35)
 );
 leaves.position.y=1.8;leaves.castShadow=true;g.add(leaves);
 g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);
}
function makeFence(){
 const f=mat(0x777f7c,.65,.7);
 for(let i=-7;i<=7;i++){
  for(let z of [-7,7])cylinder(.045,.045,1.2,f,i, .6,z);
  for(let x of [-7,7])cylinder(.045,.045,1.2,f,x,.6,i);
 }
 for(let y of [.35,.85]){
  box(14,.035,.035,f,0,y,-7);box(14,.035,.035,f,0,y,7);
  box(.035,.035,14,f,-7,y,0);box(.035,.035,14,f,7,y,0);
 }
}
makeFence();
for(let i=0;i<22;i++){
 const a=(i%11)*3-15;
 makeTree(a,-12-(i%3)*2,.7+(i%4)*.12);
 makeTree(a,12+(i%2)*2,.7+(i%3)*.15);
}
const road=box(3,.035,28,mat(0x777a72),-9,.02,0);
for(let z=-12;z<13;z+=2)box(.12,.04,.8,mat(0xe2d6a2),-9,.05,z);

let placed=[];
function rebuild(){
 placed.forEach(o=>scene.remove(o));placed=[];
 state.panels.forEach(p=>{
  placed.push(makePanel(p.x,p.z,p.watt));
 });
 state.inverters.forEach((v,i)=>{
  placed.push(makeInverter(5.5+(i%2)*1.2,-5+Math.floor(i/2)*1.3,v.kw));
 });
 if(state.transformer)placed.push(makeTransformer(5.7,2));
 if(state.battery)placed.push(makeBattery(5.5,5));
}
rebuild();

let drag=false,lastX=0,lastY=0,dist=25;
let targetX=0,targetZ=0;
function pointerDown(e){
 drag=true;lastX=e.clientX;lastY=e.clientY;
}
function pointerMove(e){
 if(!drag)return;
 const dx=e.clientX-lastX,dy=e.clientY-lastY;
 targetX-=dx*.025;targetZ+=dy*.025;
 targetX=Math.max(-12,Math.min(12,targetX));
 targetZ=Math.max(-12,Math.min(12,targetZ));
 lastX=e.clientX;lastY=e.clientY;
}
function pointerUp(){drag=false}
renderer.domElement.addEventListener("pointerdown",pointerDown);
renderer.domElement.addEventListener("pointermove",pointerMove);
renderer.domElement.addEventListener("pointerup",pointerUp);
renderer.domElement.addEventListener("pointercancel",pointerUp);
let pinch=0;
renderer.domElement.addEventListener("touchstart",e=>{
 if(e.touches.length===2){
  pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
  e.touches[0].clientY-e.touches[1].clientY);
 }
},{passive:true});
renderer.domElement.addEventListener("touchmove",e=>{
 if(e.touches.length===2){
  const n=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
  e.touches[0].clientY-e.touches[1].clientY);
  camera.position.multiplyScalar(pinch/n);
  pinch=n;
  camera.position.y=Math.max(7,Math.min(35,camera.position.y));
 }
},{passive:true});
function animate(){
 requestAnimationFrame(animate);
 camera.position.x+=(targetX+13-camera.position.x)*.06;
 camera.position.z+=(targetZ+20-camera.position.z)*.06;
 camera.lookAt(targetX,0,targetZ);
 renderer.render(scene,camera);
}
animate();
addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

function notify(t){
 const el=document.getElementById("message");
 el.textContent=t;el.style.display="block";
 setTimeout(()=>el.style.display="none",2200);
}
function cost(n){return "₴"+Math.round(n).toLocaleString("ru-RU")}
function buyPanel(watt){
 const price={450:2000,550:2400,600:2700,700:3100}[watt];
 if(state.money<price)return notify("Недостаточно денег");
 const count=state.panels.length;
 const x=-5+(count%5)*2.2;
 const z=-5+Math.floor(count/5)*1.8;
 if(x>5||z>5)return notify("Место на участке закончилось");
 state.money-=price;
 state.panels.push({watt,x,z});
 rebuild();updateUI();save();
 notify("Установлена панель "+watt+" Вт");
}
function buyInverter(kw){
 const price={5:8000,10:14000,30:29000,50:42000,100:70000}[kw];
 if(state.money<price)return notify("Недостаточно денег");
 state.money-=price;
 state.inverters.push({kw});
 rebuild();updateUI();save();
 notify("Инвертор "+kw+" кВт установлен");
}
function buyTransformer(){
 if(state.transformer)return notify("Трансформатор уже установлен");
 if(state.money<25000)return notify("Недостаточно денег");
 state.money-=25000;state.transformer=true;
 rebuild();updateUI();save();notify("Трансформатор подключён");
}
function buyBattery(){
 if(state.battery)return notify("Аккумулятор уже установлен");
 if(state.money<18000)return notify("Недостаточно денег");
 state.money-=18000;state.battery=true;
 rebuild();updateUI();save();notify("Аккумулятор установлен");
}
function getProduction(){
 const dc=state.panels.reduce((s,p)=>s+p.watt,0)/1000;
 const inv=state.inverters.reduce((s,i)=>s+i.kw,0);
 const ac=Math.min(dc,inv);
 return {dc,inv,ac};
}
function weatherForDay(d){
 const types=["Ясно","Переменная облачность","Облачно","Дождь"];
 return types[(d*17+Math.floor(d/3)*7)%types.length];
}
function weatherFactor(){
 return {"Ясно":1,"Переменная облачность":.75,
 "Облачно":.48,"Дождь":.25}[state.weather]||1;
}
function sunlight(hour){
 return Math.max(0,Math.sin(Math.PI*(hour-6)/12));
}
function processTime(){
 const now=Date.now();
 let elapsed=Math.max(0,Math.min(now-state.lastTime,7*24*3600000));
 const hours=elapsed/3600000;
 if(hours>0){
  const prod=getProduction();
  const dayFraction=(new Date().getHours()+new Date().getMinutes()/60);
  const averageSun=0.31;
  const generated=prod.ac*averageSun*weatherFactor()*hours;
  if(state.transformer){
   state.energy+=generated;
   const price=generated*8;
   state.money+=price;
   state.totalSold+=generated;
  }else if(state.battery){
   state.energy+=generated;
  }
  if(now-state.dayStart>=86400000){
   const days=Math.floor((now-state.dayStart)/86400000);
   state.day+=days;
   state.dayStart+=days*86400000;
   state.weather=weatherForDay(state.day);
  }
  state.lastTime=now;
  save();
 }
}
function updateUI(){
 const p=getProduction();
 document.getElementById("day").textContent=state.day;
 document.getElementById("money").textContent=cost(state.money);
 document.getElementById("power").textContent=p.ac.toFixed(2)+" кВт";
 document.getElementById("weather").textContent=state.weather;
 document.getElementById("energy").textContent=state.energy.toFixed(1);
 document.getElementById("income").textContent=cost(state.totalSold*8);
}
function save(){
 try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){}
}
function showHelp(){
 alert("SOLAR TYCOON 3D\n\n1. Купи солнечные панели.\n2. Установи инвертор — он ограничивает мощность станции.\n3. Установи трансформатор для подключения к сети.\n4. Электричество автоматически продаётся по ₴8 за кВт·ч.\n5. Новый игровой день наступает каждые 24 часа.\n\nПеремещение камеры: один палец. Масштаб: два пальца.");
}
state.weather=state.weather||weatherForDay(state.day);
processTime();updateUI();
setInterval(()=>{processTime();updateUI()},1000);
</script>
</body>
</html>
