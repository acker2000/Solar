
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Solar Tycoon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#101923;color:#fff;font-family:Arial,sans-serif}
h1{text-align:center;color:#ffd45a;margin:8px 0 18px}
.card{background:#1d2b3a;border-radius:15px;padding:15px;margin:12px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#26394c;padding:12px;border-radius:12px;text-align:center}
.stat strong{display:block;color:#ffd45a;font-size:20px;margin-top:5px}
button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:10px;background:#f5bd42;color:#18202a;font-weight:bold;font-size:16px}
button:disabled{opacity:.45}
.small{color:#aab9c8;font-size:12px;text-align:center}
#status{text-align:center;color:#a9d6ff;font-size:13px;margin:10px}
canvas{width:100%;background:#26394c;border-radius:12px}
</style>
</head>
<body>

<h1>☀️ SOLAR TYCOON</h1>

<div id="status">Подключение к игре...</div>

<div class="card stats">
  <div class="stat">День<strong id="day">1</strong></div>
  <div class="stat">Деньги<strong id="money">25 000 ₴</strong></div>
  <div class="stat">Мощность<strong id="power">0 кВт</strong></div>
  <div class="stat">Энергия<strong id="energy">0 кВт⋅ч</strong></div>
</div>

<div class="card">
  <h3>🏭 Моя солнечная станция</h3>
  <canvas id="scene" width="600" height="260"></canvas>
  <p class="small">Построй станцию и продавай электричество</p>
</div>

<div class="card">
  <h3>🛒 Оборудование</h3>
  <button id="buyPanel">☀️ Панель 550 Вт — 2 500 ₴</button>
  <button id="buyInverter">⚡ Инвертор — 8 000 ₴</button>
  <button id="buyBattery">🔋 Аккумулятор 10 кВт⋅ч — 6 500 ₴</button>
  <button id="buyTransformer">🏭 Трансформатор — 12 000 ₴</button>
</div>

<div class="card">
  <h3>⚡ Электростанция</h3>
  <p>Панели: <b id="panels">0</b></p>
  <p>Инверторы: <b id="inverters">0</b></p>
  <p>Аккумуляторы: <b id="batteries">0</b></p>
  <p>Трансформаторы: <b id="transformers">0</b></p>
  <p>Общий доход: <b id="income">0 ₴</b></p>
  <button id="nextDay">🌅 Следующий день</button>
  <button id="sell">💰 Продать накопленную энергию</button>
</div>

<script>
const SUPABASE_URL = "https://nazbercjykxwizvfcjug.supabase.co";
const SUPABASE_KEY = "sb_publishable_2KDCJW1uETwld5SOBH5ztQ_oSpqZFuq";
const SAVE_URL = SUPABASE_URL + "/functions/v1/solar-save";

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

let money = 25000;
let panels = 0;
let inverters = 0;
let batteries = 0;
let transformers = 0;
let energy = 0;
let totalIncome = 0;
let day = 1;
let weather = 1;
let loaded = false;
let saveQueue = Promise.resolve();

const statusEl = document.getElementById("status");

function setStatus(message, error=false) {
  statusEl.textContent = message;
  statusEl.style.color = error ? "#ff8585" : "#a9d6ff";
}

function gameData() {
  return {
    money, panels, inverters, batteries, transformers,
    energy, totalIncome, day, weather
  };
}

function applyGameData(data) {
  if (!data || typeof data !== "object") return;
  money = Number(data.money ?? 25000);
  panels = Number(data.panels ?? 0);
  inverters = Number(data.inverters ?? 0);
  batteries = Number(data.batteries ?? 0);
  transformers = Number(data.transformers ?? 0);
  energy = Number(data.energy ?? 0);
  totalIncome = Number(data.totalIncome ?? 0);
  day = Number(data.day ?? 1);
  weather = Number(data.weather ?? 1);
}

async function cloudRequest(action, data) {
  const response = await fetch(SAVE_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY
    },
    body: JSON.stringify({
      action,
      initData: tg ? tg.initData : "",
      ...(data ? { gameData: data } : {})
    })
  });

  const result = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(result.error || `Ошибка сервера: ${response.status}`);
  }
  return result;
}

async function loadGame() {
  if (!tg || !tg.initData) {
    setStatus("Открой игру через Telegram, чтобы загрузить сохранение.", true);
    return;
  }

  try {
    setStatus("Загружаем сохранение...");
    const result = await cloudRequest("load");

    if (result.gameData) {
      applyGameData(result.gameData);
      setStatus("☁️ Сохранение загружено!");
    } else {
      setStatus("Новая игра! Прогресс будет сохраняться автоматически.");
    }

    loaded = true;
    update();
  } catch (error) {
    setStatus("Не удалось загрузить: " + error.message, true);
    console.error(error);
  }
}

function queueSave() {
  if (!loaded) return;

  const snapshot = gameData();
  saveQueue = saveQueue.then(async () => {
    setStatus("☁️ Сохраняем...");
    await cloudRequest("save", snapshot);
    setStatus("☁️ Прогресс сохранён");
  }).catch(error => {
    setStatus("Ошибка сохранения: " + error.message, true);
    console.error(error);
  });
}

function update() {
  document.getElementById("money").textContent =
    Math.floor(money).toLocaleString("ru-RU") + " ₴";
  document.getElementById("power").textContent =
    (panels * 0.55).toFixed(2) + " кВт";
  document.getElementById("energy").textContent =
    energy.toFixed(1) + " кВт⋅ч";
  document.getElementById("day").textContent = day;
  document.getElementById("panels").textContent = panels;
  document.getElementById("inverters").textContent = inverters;
  document.getElementById("batteries").textContent = batteries;
  document.getElementById("transformers").textContent = transformers;
  document.getElementById("income").textContent =
    Math.floor(totalIncome).toLocaleString("ru-RU") + " ₴";
  drawScene();
}

function buy(type, price) {
  if (!loaded) return;
  if (money < price) {
    setStatus("Недостаточно денег!", true);
    return;
  }

  money -= price;
  if (type === "panels") panels++;
  if (type === "inverters") inverters++;
  if (type === "batteries") batteries++;
  if (type === "transformers") transformers++;

  update();
  queueSave();
}

function nextDay() {
  if (!loaded) return;

  day++;
  weather = 0.5 + Math.random() * 0.8;

  const generated = panels * 0.55 * 5 * weather;
  const usable = Math.min(generated, inverters * 5);
  energy += usable;

  update();
  queueSave();
}

function sellEnergy() {
  if (!loaded) return;
  if (energy <= 0) {
    setStatus("Пока нет энергии для продажи.");
    return;
  }

  const earnings = energy * 8;
  money += earnings;
  totalIncome += earnings;
  energy = 0;

  update();
  queueSave();
}

function drawScene() {
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,600,260);

  ctx.fillStyle = "#83b6d5";
  ctx.fillRect(0,0,600,260);
  ctx.fillStyle = "#4c8652";
  ctx.fillRect(0,165,600,95);

  for (let i=0; i<Math.min(panels,12); i++) {
    const x = 35 + (i%4)*135;
    const y = 80 + Math.floor(i/4)*55;
    ctx.fillStyle = "#172f52";
    ctx.fillRect(x,y,100,38);
    ctx.strokeStyle = "#6ca9d9";
    ctx.lineWidth = 2;
    ctx.strokeRect(x,y,100,38);
    ctx.beginPath();
    ctx.moveTo(x+50,y);
    ctx.lineTo(x+50,y+38);
    ctx.moveTo(x,y+19);
    ctx.lineTo(x+100,y+19);
    ctx.stroke();
  }

  ctx.fillStyle = "#ffd45a";
  ctx.beginPath();
  ctx.arc(525,45,24,0,Math.PI*2);
  ctx.fill();
}

document.getElementById("buyPanel").onclick =
  () => buy("panels",2500);
document.getElementById("buyInverter").onclick =
  () => buy("inverters",8000);
document.getElementById("buyBattery").onclick =
  () => buy("batteries",6500);
document.getElementById("buyTransformer").onclick =
  () => buy("transformers",12000);
document.getElementById("nextDay").onclick = nextDay;
document.getElementById("sell").onclick = sellEnergy;

update();
loadGame();
</script>
</body>
</html>
